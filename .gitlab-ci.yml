---
# GitLab CI/CD Pipeline for hnsw
# SPDX-License-Identifier: Apache-2.0

include:
  # Security scanning
  - component: gitlab.com/devnw/ci-catalog/security-sast@v1.7.1
  - component: gitlab.com/devnw/ci-catalog/security-dependency-scanning@v1.7.1
  - component: gitlab.com/devnw/ci-catalog/security-secrets@v1.7.1
  - component: gitlab.com/devnw/ci-catalog/security-gitleaks@v1.7.1

  # NOTE: zig-format component removed — it hardcodes Zig 0.14.0 URLs
  # which are incompatible with 0.15.x tarball naming. Format check is
  # done in the zig-format job below instead.

  # SBOM
  - component: gitlab.com/devnw/ci-catalog/sbom-generate@v1.7.1
  - component: gitlab.com/devnw/ci-catalog/sbom-scan@v1.7.1

  # Release
  - component: gitlab.com/devnw/ci-catalog/release-semantic@v1.7.1

variables:
  ZIG_VERSION: "0.15.2"

stages:
  - lint
  - build
  - test
  - security
  - sbom
  - release

# Zig installation template (uses cache to avoid re-downloading)
.install-zig: &install-zig
  - |
    if [ ! -f "zig-x86_64-linux-${ZIG_VERSION}/zig" ]; then
      apt-get update && apt-get install -y curl xz-utils
      curl -fsSL "https://ziglang.org/download/${ZIG_VERSION}/zig-x86_64-linux-${ZIG_VERSION}.tar.xz" -o zig.tar.xz
      tar -xf zig.tar.xz
      rm zig.tar.xz
    fi
  - export PATH="$PWD/zig-x86_64-linux-${ZIG_VERSION}:$PATH"
  - zig version

# Cache Zig toolchain across pipeline jobs
.zig-cache: &zig-cache
  cache:
    key: "zig-${ZIG_VERSION}"
    paths:
      - "zig-x86_64-linux-${ZIG_VERSION}/"

# Format check (replaces zig-format component for 0.15.x compatibility)
zig-format:
  stage: lint
  image: debian:bookworm-slim
  <<: *zig-cache
  before_script:
    - *install-zig
  script:
    - zig fmt --check src/ tests/ examples/ build.zig

# Build job
build:
  stage: build
  image: debian:bookworm-slim
  <<: *zig-cache
  before_script:
    - *install-zig
  script:
    - zig build

# Unit tests
test:
  stage: test
  image: debian:bookworm-slim
  <<: *zig-cache
  before_script:
    - *install-zig
  script:
    - zig build test --summary all
  needs:
    - build

# Integration tests
test-integration:
  stage: test
  image: debian:bookworm-slim
  <<: *zig-cache
  before_script:
    - *install-zig
  script:
    - zig build test-integration --summary all
  needs:
    - build

# Release optimization tests
test-release-safe:
  stage: test
  image: debian:bookworm-slim
  <<: *zig-cache
  before_script:
    - *install-zig
  script:
    - zig build test -Doptimize=ReleaseSafe --summary all
  needs:
    - build

# Cross-compilation tests
test-cross-build:
  stage: test
  image: debian:bookworm-slim
  <<: *zig-cache
  before_script:
    - *install-zig
  script:
    - zig build -Dtarget=x86_64-linux
    - zig build -Dtarget=aarch64-linux
    - zig build -Dtarget=x86_64-macos
    - zig build -Dtarget=aarch64-macos
  needs:
    - build
